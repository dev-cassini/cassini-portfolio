<section class="contact">
  <div class="container contact__container">
    <div class="contact__content">
      <p class="eyebrow">04 / Basecamp</p>
      <h1>Let’s find the<br />next route.</h1>
      <p class="contact__intro">Have a project, a question, or a promising trail to explore? Send a note and I’ll get back to you soon.</p>
      <form class="contact-form" (ngSubmit)="sendMessage()">
        <h2>Start a conversation</h2>
        <div class="contact-form__fields"><label>Your name<input name="name" [(ngModel)]="name" required /></label><label>Email address<input type="email" name="email" [(ngModel)]="email" required /></label></div>
        <label>How can I help?<textarea name="message" [(ngModel)]="message" required></textarea></label>
        <p>I usually reply within two working days.</p>
        <button class="btn" type="submit">Send message <span aria-hidden="true">↗</span></button>
      </form>
    </div>
    <aside class="contact-panel" aria-label="Contact details">
      <p class="contact-panel__label">Open trail</p>
      <svg viewBox="0 0 320 240" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-linejoin="round"><path d="M30 184 160 38l130 146-130 25Z"/><path d="M55 177 160 60l105 117-105 17Z"/><path d="M78 169 160 82l82 87-82 12Z"/><path d="M100 161 160 102l60 59-60 8Z"/><path d="M120 153 160 120l40 33-40 5Z"/></g><path d="m160 143 5 8h-10Z" fill="var(--text-highlight)" /></svg>
      <div class="contact-panel__details"><a href="mailto:hello@cassini.dev">hello@cassini.dev</a><span>Nottingham, UK</span></div>
    </aside>
  </div>
</section>
